services:
  app:
    build: .
    restart: unless-stopped
    # Standard: nur lokal erreichbar. TLS und Subdomain macht der Reverse Proxy
    # davor, der API-Key soll nie an einem offenen Port haengen (spec Q8).
    # Fuer eine Demo im WLAN (Handy/Tablet) in .env BIND_ADDR=0.0.0.0 setzen --
    # dann ist die App fuer jeden im Netz erreichbar, geschuetzt nur durch das
    # Login. In Produktion BIND_ADDR nicht setzen.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-9081}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Muss auf das Volume zeigen, NICHT nach /app/data -- dort liegen die
      # statischen Datensaetze aus dem Image (siehe Dockerfile).
      DATABASE_PATH: /app/var/app.db
    volumes:
      - leaddata:/app/var

volumes:
  leaddata:
